services:
  - type: web
    name: trustvault
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: TRUSTVAULT_DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: TRUSTVAULT_DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: TRUSTVAULT_STORAGE_DIR
        value: /var/data/trustvault-files
      - key: TRUSTVAULT_AUDIT_HMAC_KEY
        generateValue: true
      - key: TRUSTVAULT_BOOTSTRAP_USERS_ENABLED
        value: "true"
      - key: TRUSTVAULT_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: TRUSTVAULT_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: TRUSTVAULT_BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: TRUSTVAULT_BOOTSTRAP_OWNER_PASSWORD
        sync: false
      - key: TRUSTVAULT_BOOTSTRAP_VIEWER_EMAIL
        sync: false
      - key: TRUSTVAULT_BOOTSTRAP_VIEWER_PASSWORD
        sync: false
      - key: TRUSTVAULT_CORS_ALLOWED_ORIGIN
        value: https://trustvault.invalid
    disk:
      name: trustvault-files
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: trustvault-db
    databaseName: trustvault
    user: trustvault
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"
    diskSizeGB: 1
