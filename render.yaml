services:
  - type: web
    name: trustvault
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: TRUSTVAULT_DATABASE_URL
        sync: false
      - key: TRUSTVAULT_DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: TRUSTVAULT_STORAGE_DIR
        value: /tmp/trustvault-files
      - key: TRUSTVAULT_STORAGE_S3_REQUIRED
        value: "true"
      - key: TRUSTVAULT_STORAGE_S3_ENDPOINT
        sync: false
      - key: TRUSTVAULT_STORAGE_S3_BUCKET
        sync: false
      - key: TRUSTVAULT_STORAGE_S3_ACCESS_KEY
        sync: false
      - key: TRUSTVAULT_STORAGE_S3_SECRET_KEY
        sync: false
      - key: TRUSTVAULT_STORAGE_S3_REGION
        sync: false
      - key: TRUSTVAULT_AUDIT_HMAC_KEY
        generateValue: true
      - key: TRUSTVAULT_BOOTSTRAP_USERS_ENABLED
        value: "true"
      - key: TRUSTVAULT_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: TRUSTVAULT_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: TRUSTVAULT_BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: TRUSTVAULT_BOOTSTRAP_OWNER_PASSWORD
        sync: false
      - key: TRUSTVAULT_BOOTSTRAP_VIEWER_EMAIL
        sync: false
      - key: TRUSTVAULT_BOOTSTRAP_VIEWER_PASSWORD
        sync: false
      - key: TRUSTVAULT_CORS_ALLOWED_ORIGIN
        value: https://trustvault.invalid
