# Production must provide TRUSTVAULT_DATABASE_URL/USERNAME/PASSWORD,
# TRUSTVAULT_STORAGE_DIR, TRUSTVAULT_AUDIT_HMAC_KEY, and the frontend origin.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
trustvault.dev-admin.enabled=false
trustvault.dev-owner.enabled=false
trustvault.dev-viewer.enabled=false
