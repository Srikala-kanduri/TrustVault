# Production must provide a PostgreSQL URL, private file storage path, and a
# stable audit HMAC key. The same-origin Render deployment needs no CORS origin.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/schema.sql
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
trustvault.dev-admin.enabled=false
trustvault.dev-owner.enabled=false
trustvault.dev-viewer.enabled=false
trustvault.storage.s3.required=${TRUSTVAULT_STORAGE_S3_REQUIRED:true}
trustvault.storage.s3.endpoint=${TRUSTVAULT_STORAGE_S3_ENDPOINT:}
trustvault.storage.s3.bucket=${TRUSTVAULT_STORAGE_S3_BUCKET:}
trustvault.storage.s3.access-key=${TRUSTVAULT_STORAGE_S3_ACCESS_KEY:}
trustvault.storage.s3.secret-key=${TRUSTVAULT_STORAGE_S3_SECRET_KEY:}
trustvault.storage.s3.region=${TRUSTVAULT_STORAGE_S3_REGION:}
trustvault.bootstrap-users.enabled=${TRUSTVAULT_BOOTSTRAP_USERS_ENABLED:false}
trustvault.bootstrap-users.admin-email=${TRUSTVAULT_BOOTSTRAP_ADMIN_EMAIL:}
trustvault.bootstrap-users.admin-password=${TRUSTVAULT_BOOTSTRAP_ADMIN_PASSWORD:}
trustvault.bootstrap-users.owner-email=${TRUSTVAULT_BOOTSTRAP_OWNER_EMAIL:}
trustvault.bootstrap-users.owner-password=${TRUSTVAULT_BOOTSTRAP_OWNER_PASSWORD:}
trustvault.bootstrap-users.viewer-email=${TRUSTVAULT_BOOTSTRAP_VIEWER_EMAIL:}
trustvault.bootstrap-users.viewer-password=${TRUSTVAULT_BOOTSTRAP_VIEWER_PASSWORD:}
