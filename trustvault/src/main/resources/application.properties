    spring.application.name=trustvault
    spring.datasource.url=jdbc:h2:mem:trustvault
    spring.datasource.driver-class-name=org.h2.Driver
    spring.datasource.username=sa
    spring.datasource.password=

    spring.jpa.hibernate.ddl-auto=update
    spring.h2.console.enabled=true
    # Development account provisioning
    trustvault.dev-admin.enabled=false
    trustvault.dev-admin.email=admin@trustvault.local
    trustvault.dev-admin.password=${TRUSTVAULT_DEV_ADMIN_PASSWORD}
    # Private document file storage
    trustvault.storage.directory=${TRUSTVAULT_STORAGE_DIR:./trustvault-private-files}
    spring.servlet.multipart.max-file-size=10MB
    spring.servlet.multipart.max-request-size=11MB
    # Development-only test account provisioning; disabled by default
trustvault.dev-owner.enabled=false
trustvault.dev-owner.email=owner@trustvault.local
trustvault.dev-owner.password=${TRUSTVAULT_DEV_OWNER_PASSWORD}
# Development-only viewer provisioning; disabled by default
trustvault.dev-viewer.enabled=false
trustvault.dev-viewer.email=viewer@trustvault.local
trustvault.dev-viewer.password=${TRUSTVAULT_DEV_VIEWER_PASSWORD}