spring.application.name=trustvault
server.port=${PORT:8080}

# Local default. Persistent deployments override these values via environment.
spring.datasource.url=${TRUSTVAULT_DATABASE_URL:jdbc:h2:mem:trustvault}
spring.datasource.driver-class-name=${TRUSTVAULT_DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${TRUSTVAULT_DATABASE_USERNAME:sa}
spring.datasource.password=${TRUSTVAULT_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${TRUSTVAULT_JPA_DDL_AUTO:update}
spring.h2.console.enabled=${TRUSTVAULT_H2_CONSOLE_ENABLED:true}

# Development role initializers only run with the dev profile.
trustvault.dev-admin.enabled=${TRUSTVAULT_DEV_ADMIN_ENABLED:true}
trustvault.dev-admin.email=${TRUSTVAULT_DEV_ADMIN_EMAIL:admin@trustvault.local}
trustvault.dev-admin.password=${TRUSTVAULT_DEV_ADMIN_PASSWORD:}
trustvault.dev-owner.enabled=${TRUSTVAULT_DEV_OWNER_ENABLED:true}
trustvault.dev-owner.email=${TRUSTVAULT_DEV_OWNER_EMAIL:owner@trustvault.local}
trustvault.dev-owner.password=${TRUSTVAULT_DEV_OWNER_PASSWORD:}
trustvault.dev-viewer.enabled=${TRUSTVAULT_DEV_VIEWER_ENABLED:true}
trustvault.dev-viewer.email=${TRUSTVAULT_DEV_VIEWER_EMAIL:viewer@trustvault.local}
trustvault.dev-viewer.password=${TRUSTVAULT_DEV_VIEWER_PASSWORD:}

trustvault.storage.directory=${TRUSTVAULT_STORAGE_DIR:./trustvault-private-files}
trustvault.audit.hmac-key=${TRUSTVAULT_AUDIT_HMAC_KEY}
trustvault.cors.allowed-origin=${TRUSTVAULT_CORS_ALLOWED_ORIGIN:http://localhost:5173}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
trustvault.security.rate-limit.api-per-minute=${TRUSTVAULT_API_RATE_LIMIT_PER_MINUTE:120}
trustvault.security.rate-limit.login-per-minute=${TRUSTVAULT_LOGIN_RATE_LIMIT_PER_MINUTE:10}
