spring.application.name=trustvault
spring.datasource.url=jdbc:h2:mem:trustvault
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# Development account provisioning
trustvault.dev-admin.enabled=true
trustvault.dev-admin.email=admin@trustvault.local
trustvault.dev-admin.password=${TRUSTVAULT_DEV_ADMIN_PASSWORD}
spring.profiles.active=dev